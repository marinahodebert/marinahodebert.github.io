<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marina · Raccourcis</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raccourcis">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232340FF'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : une colonne de groupes, chaque groupe = une grille de tuiles. Bleu Marina en accent. */
:root{
  --bg:#f4f5fb; --card:#ffffff; --ink:#151a33; --muted:#5d6482; --line:#dfe2ef;
  --accent:#2340FF; --accent-soft:#e7ebff;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1122; --card:#171b33; --ink:#eceffd; --muted:#a2a8c6; --line:#2a3052;
  --accent:#7d8dff; --accent-soft:#232a55; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
h1{font:800 clamp(1.9rem,5vw,2.6rem)/1 var(--f-display);margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.date{color:var(--muted);margin-top:6px}
.search{position:relative;flex:1 1 260px;max-width:360px}
.search input{width:100%;font:500 1rem var(--f-ui);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px 11px 38px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 .75rem var(--f-ui);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
section{margin-top:26px}
h2{font:600 .78rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
a.tile{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;transition:border-color .15s,transform .15s}
a.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
a.tile:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.ico{flex:0 0 36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:800 1rem var(--f-display);overflow:hidden}
.ico img{width:22px;height:22px}
.txt{min-width:0;display:block;flex:1}
.name,.desc{display:block}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{margin-top:40px;color:var(--muted);font-size:.82rem}
@media (prefers-reduced-motion:reduce){a.tile{transition:none}}
@media (hover:none){.search kbd{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="hello">Bonjour <span>Marina</span></h1>
      <div class="date" id="date"></div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un raccourci" aria-label="Rechercher un raccourci" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </label>
  </header>
  <main id="groups"></main>
  <footer>Pour ajouter un raccourci : modifie la liste LIENS en haut du script de cette page.</footer>
</div>

<script>
/* ====== TES RACCOURCIS ======
   Un raccourci = { nom, desc, url }. Ajoute, retire ou déplace des lignes ici. */
const LIENS = [
  { groupe: "Théâtre · Arturo Ui", liens: [
    { nom: "Outil de répétition", desc: "Prologue, Butcher, Giri et notes", url: "https://claude.ai/artifact/2XBbLBPC363D9HiFDK2mnF" },
    { nom: "Intentions de jeu", desc: "Scène par scène", url: "https://claude.ai/artifact/SX55ZB8LTnfaWQHCPp6KKF" },
  ]},
  { groupe: "Mes sites", liens: [
    { nom: "Un Ananas en cuisine", desc: "Mon blog de recettes", url: "https://unananasencuisine.fr" },
    { nom: "Portfolio pro", desc: "marinahodebert.github.io/Pro", url: "https://marinahodebert.github.io/Pro" },
    { nom: "Cockpit perso", desc: "Sur ChatGPT", url: "https://marina-cockpit.mhodebert.chatgpt.site" },
    { nom: "Ancien blog Wix", desc: "Message de déménagement", url: "https://ananasnature.wixsite.com/website" },
    { nom: "Instagram du blog", desc: "@marina_l_ananas", url: "https://www.instagram.com/marina_l_ananas/" },
  ]},
  { groupe: "Mes pages Claude", liens: [
    { nom: "Mes sites et outils", desc: "Où est rangé quoi", url: "https://claude.ai/artifact/QwVCp8d4rYbN31RFP5P8Nk" },
    { nom: "Plan des combles", desc: "Réaménagement", url: "https://claude.ai/artifact/B9UYENDQaVHMGYoNEVcJv6" },
    { nom: "Bibliothèque Marina", desc: "V4 Hybride", url: "https://claude.ai/artifact/Cg9JYRebWko6yRwHwERjAf" },
    { nom: "Toutes mes pages Claude", desc: "La liste complète", url: "https://claude.ai/code/artifacts" },
  ]},
  { groupe: "Outils", liens: [
    { nom: "Claude", desc: "claude.ai", url: "https://claude.ai" },
    { nom: "ChatGPT", desc: "chatgpt.com", url: "https://chatgpt.com" },
    { nom: "Todoist", desc: "Mes tâches", url: "https://app.todoist.com" },
  ]},
  { groupe: "Gestion des sites", liens: [
    { nom: "Netlify", desc: "Héberge le blog", url: "https://app.netlify.com" },
    { nom: "GitHub", desc: "marinahodebert", url: "https://github.com/marinahodebert" },
    { nom: "Dépôt Bibliothèque", desc: "bibliotheque-marina", url: "https://github.com/marinahodebert/bibliotheque-marina" },
    { nom: "OVHcloud", desc: "Domaine unananasencuisine.fr", url: "https://www.ovh.com/manager/" },
    { nom: "Modifier cette page", desc: "Son dépôt sur GitHub", url: "https://github.com/marinahodebert/marinahodebert.github.io" },
  ]},
];
/* ====== fin de la liste ====== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const host = u => { try { return new URL(u).hostname; } catch (e) { return ""; } };
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function tile(l) {
  const h = host(l.url), letter = esc((l.nom || "?").trim()[0].toUpperCase());
  return `<a class="tile" href="${esc(l.url)}" target="_blank" rel="noopener">
    <span class="ico"><img src="https://icons.duckduckgo.com/ip3/${esc(h)}.ico" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${letter}'))"></span>
    <span class="txt"><span class="name">${esc(l.nom)}</span><span class="desc">${esc(l.desc || h)}</span></span></a>`;
}
function render(q) {
  const n = norm(q || "");
  const html = LIENS.map(g => {
    const ls = g.liens.filter(l => !n || norm(l.nom + " " + (l.desc || "") + " " + g.groupe).includes(n));
    return ls.length ? `<section><h2>${esc(g.groupe)}</h2><div class="grid">${ls.map(tile).join("")}</div></section>` : "";
  }).join("");
  document.getElementById("groups").innerHTML = html || `<p class="empty">Aucun raccourci ne correspond à « ${esc(q)} ».</p>`;
}
const qi = document.getElementById("q");
qi.addEventListener("input", () => render(qi.value));
qi.addEventListener("keydown", e => {
  if (e.key === "Enter") { const a = document.querySelector("a.tile"); if (a) window.open(a.href, "_blank", "noopener"); }
  if (e.key === "Escape") { qi.value = ""; render(""); qi.blur(); }
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== qi) { e.preventDefault(); qi.focus(); } });

const now = new Date(), h = now.getHours();
document.getElementById("hello").innerHTML = (h < 5 || h >= 18 ? "Bonsoir" : "Bonjour") + " <span>Marina</span>";
document.getElementById("date").textContent = now.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
render("");
</script>
</body>
</html>
